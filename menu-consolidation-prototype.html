<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Build 菜单整合原型</title>
  <style>
    :root { --bg:#f6f7fb; --panel:#fff; --line:#e9ebf2; --text:#22242a; --muted:#81848d; --primary:#425bff; --primary-bg:#f0f2ff; --green:#13a64a; --orange:#ed8b24; --red:#ef6363; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; font-size:15px; }
    button { font:inherit; cursor:pointer; }
    .app { display:flex; min-height:100vh; padding:16px 0 0 14px; }
    aside { width:310px; flex:none; border-radius:42px 0 0 0; background:#f8f8fc; padding:42px 16px 24px; border:1px solid #ebeef5; border-bottom:0; }
    .brand { display:flex; align-items:center; justify-content:space-between; padding:0 18px 40px; }
    .brand h1 { margin:0; font-size:38px; letter-spacing:1px; }
    .top-icons { display:flex; gap:18px; color:#595b62; font-size:26px; }
    .nav { display:grid; gap:8px; }
    .nav button { height:56px; padding:0 20px; border:0; background:transparent; border-radius:28px; color:#41434a; text-align:left; display:flex; align-items:center; gap:13px; font-size:21px; }
    .nav button:hover { background:#f0f1f7; }
    .nav button.active { background:#ecedf3; color:#16171b; font-weight:700; }
    .nav .new { margin-bottom:4px; }
    .nav .ico { width:24px; text-align:center; font-size:22px; color:#62646b; }
    .section { margin:62px 20px 0; }
    .section h2 { font-size:17px; color:#858791; font-weight:600; margin:0 0 22px; }
    .pinned { display:grid; gap:19px; font-size:18px; line-height:1.3; }
    .spaces-head { display:flex; align-items:center; justify-content:space-between; }
    .spaces-icons { color:#8a8d96; font-size:20px; letter-spacing:10px; white-space:nowrap; }
    .space-list { display:grid; gap:18px; font-size:18px; }
    .space { display:flex; align-items:center; gap:10px; color:#44464e; }
    .folder { color:#858891; }
    main { flex:1; min-width:0; background:#fff; padding:65px 82px; overflow:hidden; }
    .page { max-width:1260px; margin:auto; }
    .page-head { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:44px; }
    .title { margin:0; font-size:34px; font-weight:700; }
    .sub { margin:9px 0 0; color:var(--muted); font-size:16px; }
    .primary { border:0; color:white; background:var(--primary); border-radius:12px; padding:13px 20px; font-weight:600; box-shadow:0 5px 12px #425bff24; }
    .tabs, .filters { display:flex; align-items:center; gap:30px; flex-wrap:wrap; }
    .tabs { border-bottom:1px solid var(--line); margin-bottom:25px; }
    .tabs button { padding:0 0 18px; border:0; background:transparent; font-size:28px; color:#989aa1; white-space:nowrap; }
    .tabs button.active { color:#1e2025; font-weight:700; border-bottom:3px solid var(--primary); }
    .filters { margin:0 0 32px; }
    .filters button { border:0; background:transparent; color:#777981; padding:10px 16px; border-radius:24px; font-size:17px; }
    .filters button.active { border:2px solid #4c64ff; color:#405bff; background:#f7f8ff; padding:8px 14px; }
    .toolbar { display:flex; gap:12px; align-items:center; margin-left:auto; }
    .search { width:230px; border:1px solid var(--line); border-radius:10px; padding:11px 14px; color:#8a8c94; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(360px,1fr)); gap:28px; }
    .card { min-height:226px; border:1px solid var(--line); border-radius:26px; padding:30px 32px; transition:.16s ease; cursor:pointer; }
    .card:hover { transform:translateY(-2px); border-color:#bdc5ff; box-shadow:0 8px 28px #1d2d6a0c; }
    .card-top { display:flex; gap:18px; align-items:flex-start; }
    .avatar { width:58px; height:58px; border-radius:18px; color:white; display:grid; place-items:center; font-size:25px; font-weight:700; flex:none; }
    .avatar.blue { background:#3f5bff; } .avatar.green { background:#13a54c; } .avatar.purple { background:#7239e8; } .avatar.teal { background:#1196b7; } .avatar.gray { background:#636b78; }
    .name { font-size:23px; font-weight:700; margin:1px 0 9px; }
    .tags { display:flex; gap:8px; flex-wrap:wrap; }
    .tag { border:1px solid #d9dce4; border-radius:6px; padding:2px 7px; color:#777982; font-size:14px; line-height:20px; }
    .tag.green { color:var(--green); border-color:#92d8aa; } .tag.orange { color:var(--orange); border-color:#f4c38c; } .tag.red { color:var(--red); border-color:#f2abab; }
    .desc { margin:21px 0 0; color:#72757d; font-size:18px; line-height:1.6; }
    .card-foot { margin-top:24px; display:flex; justify-content:space-between; color:#a0a2aa; font-size:16px; }
    .empty { height:350px; border:1px dashed #d6d9e3; border-radius:22px; display:grid; place-items:center; color:#858791; font-size:17px; background:#fcfcfe; }
    .task-grid { display:grid; grid-template-columns:1.5fr 1fr; gap:26px; }
    .panel { border:1px solid var(--line); border-radius:22px; padding:27px; }
    .panel h3 { margin:0 0 20px; font-size:20px; }
    .row { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid #f0f1f5; }
    .row:last-child { border:0; padding-bottom:0; }
    .row b { display:block; font-size:17px; } .row span { display:block; color:#90929a; margin-top:5px; }
    .status { color:var(--primary); background:var(--primary-bg); border-radius:7px; padding:5px 9px; font-size:13px; }
    .new-page { max-width:820px; padding-top:35px; }
    .prompt { border:1px solid #dce0ea; border-radius:22px; padding:26px; min-height:164px; color:#9699a2; font-size:19px; line-height:1.6; box-shadow:0 8px 25px #1e2b5b08; }
    .chips { display:flex; gap:12px; flex-wrap:wrap; margin:20px 0 32px; }
    .chip { border:1px solid #dce0ea; background:#fff; border-radius:20px; padding:8px 13px; color:#62656c; }
    .note { border-radius:14px; background:#f5f6fb; padding:17px 18px; color:#63666e; line-height:1.6; }
    @media(max-width:1000px) { aside { width:250px; } main { padding:42px; } .grid { grid-template-columns:1fr; } .tabs button { font-size:22px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><h1>开发</h1><div class="top-icons">⌕　▯</div></div>
      <nav class="nav">
        <button class="new" data-page="new"><span class="ico">✦</span>新任务</button>
        <button class="active" data-page="capability"><span class="ico">▱</span>能力管理</button>
        <button data-page="development"><span class="ico">♧</span>开发管理</button>
      </nav>
      <section class="section"><h2>置顶</h2><div class="pinned"><div>采购订单元数据配置</div><div>供应商订单元数据</div></div></section>
      <section class="section"><div class="spaces-head"><h2>空间</h2><div class="spaces-icons">⌕ ⊞ ☷</div></div><div class="space-list"><div class="space"><span class="folder">▱</span>合同与台账　›</div><div class="space"><span class="folder">▱</span>差旅费用报销⌄</div><div class="space"><span class="folder">▱</span>客户跟进智能体⌄</div><div class="space"><span class="folder">▱</span>业务组件库⌄</div><div class="space"><span class="folder">▱</span>采购寻源智能体⌄</div></div></section>
    </aside>
    <main><div id="content" class="page"></div></main>
  </div>
  <script>
    const items = {
      智能体: [
        ['应收账龄分析','应','blue','已上架','green','v1.2.0','按客户、账龄区间汇总应收余额，标出逾期 60 天以上的大额往来并给出催收建议。','3 个能力在用','更新于 今天 10:24'],
        ['费用报销助手','费','green','审核中','orange','v0.8.0','根据报销制度核验单据、识别异常项目并给出修改建议。','等待审核','更新于 昨天 16:40'],
        ['合同风险审查','合','purple','已上架','green','v1.0.3','识别合同条款风险，输出结构化审查意见和修改建议。','12 人在用','更新于 10 月 28 日']
      ],
      技能: [
        ['采购价格异常识别','采','blue','开发中','orange','v0.3.0','比较历史价格和价目表价格，识别采购订单中的价格异常。','关联 2 个连接器','更新于 今天 09:18'],
        ['报销单据核验','票','teal','已上架','green','v1.1.0','核验报销单附件、金额和制度要求，输出异常说明。','5 个智能体在用','更新于 10 月 29 日']
      ],
      应用: [
        ['应收账龄看板','应','blue','已上架','green','v1.0.0','面向财务团队的应收账龄分析应用，支持筛选、预警和催收跟进。','合同与台账空间','更新于 今天 10:24'],
        ['采购预警工作台','购','purple','开发中','orange','v0.2.0','集中查看采购价格异常、处理进度和风险趋势。','采购寻源空间','更新于 昨天 18:20']
      ],
      连接器: [
        ['采购订单查询','采','teal','已连接','green','全局可用','为智能体和技能提供采购订单及明细数据查询能力。','连接方式：MCP','最近调用 今天 10:02'],
        ['企业知识检索','知','purple','已连接','green','全局可用','在 Build 会话中检索企业知识库，补充业务上下文。','连接方式：知识库','最近调用 今天 09:45'],
        ['ERP 测试环境','测','gray','待授权','orange','苍穹 V8.0','用于苍穹应用开发、调试和测试的企业环境连接。','需要完成授权','更新于 10 月 30 日']
      ],
      业务组件: [
        ['采购价格判断组件','价','green','已上架','green','v1.0.0','封装价格判断和异常标记逻辑，可被应用和智能体复用。','3 个应用在用','更新于 10 月 27 日'],
        ['合同条款抽取组件','条','purple','审核中','orange','v0.5.1','从合同文档中抽取关键条款，返回统一结构化数据。','等待审核','更新于 10 月 26 日']
      ]
    };
    let currentType = '全部'; let currentPage = 'capability';
    const content = document.getElementById('content');
    const card = x => `<article class="card"><div class="card-top"><div class="avatar ${x[2]}">${x[1]}</div><div><div class="name">${x[0]}</div><div class="tags"><span class="tag ${x[4]}">${x[3]}</span><span class="tag">${x[5]}</span></div></div></div><p class="desc">${x[6]}</p><div class="card-foot"><span>${x[7]}</span><span>${x[8]}</span></div></article>`;
    function capability() {
      const types = ['全部','智能体','技能','应用','连接器','业务组件'];
      const list = currentType === '全部' ? Object.values(items).flat() : items[currentType];
      const status = currentType === '连接器' ? ['全部','已连接','待授权','异常','已停用'] : ['全部','开发中','审核中','已上架','已驳回'];
      content.innerHTML = `<div class="page-head"><div><h2 class="title">能力管理</h2><p class="sub">统一管理 Build 可调用、可复用和可交付的能力</p></div><div class="toolbar"><div class="search">⌕　搜索能力</div><button class="primary">＋ 新建能力</button></div></div><div class="tabs">${types.map(t=>`<button class="${t===currentType?'active':''}" data-type="${t}">${t}</button>`).join('')}</div><div class="filters">${status.map((s,i)=>`<button class="${i===0?'active':''}">${s}${i===0?' · '+list.length:''}</button>`).join('')}</div><div class="grid">${list.map(card).join('')}</div>`;
      document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{currentType=b.dataset.type; capability()});
    }
    function development() {
      content.innerHTML = `<div class="page-head"><div><h2 class="title">开发管理</h2><p class="sub">管理项目、任务与协作分工</p></div><button class="primary">＋ 新建任务</button></div><div class="tabs"><button class="active">项目与任务</button><button>开发团队</button><button>开发助手配置</button></div><div class="task-grid"><section class="panel"><h3>进行中的任务</h3><div class="row"><div><b>采购价格异常预警</b><span>采购寻源智能体 · 3 项待办</span></div><i class="status">开发中</i></div><div class="row"><div><b>费用报销智能体优化</b><span>差旅费用报销 · 等待评测</span></div><i class="status">待评测</i></div><div class="row"><div><b>合同风险审查应用</b><span>合同与台账 · 2 人协作</span></div><i class="status">进行中</i></div></section><section class="panel"><h3>本项目开发助手</h3><div class="row"><div><b>业务应用开发助手</b><span>负责设计与实现</span></div><i class="status">已启用</i></div><div class="row"><div><b>评测助手</b><span>负责生成与运行评测</span></div><i class="status">已启用</i></div><div class="row"><div><b>代码检查助手</b><span>负责检查和修复建议</span></div><i class="status">已启用</i></div></section></div>`;
    }
    function newTask() {
      content.innerHTML = `<div class="new-page"><h2 class="title">新任务</h2><p class="sub">描述你想完成的事情，Build 会帮助你发起开发。</p><div class="prompt">例如：帮我开发一个采购价格异常预警能力，比较历史采购价和价目表价格，并在异常时给出处理建议。</div><div class="chips"><span class="chip">创建智能体</span><span class="chip">开发技能</span><span class="chip">开发应用</span><span class="chip">配置连接器</span></div><button class="primary">开始开发　→</button><p class="note">本次会话将自动使用你已启用的 Build 能力；你可以在能力管理中统一配置智能体、技能、应用、连接器和业务组件。</p></div>`;
    }
    function render() { if(currentPage==='new') newTask(); else if(currentPage==='development') development(); else capability(); }
    document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{currentPage=b.dataset.page; document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b)); render();});
    render();
  </script>
</body>
</html>
