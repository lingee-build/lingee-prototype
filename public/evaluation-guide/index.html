<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>Build evaluation guide</title>
    <link rel="stylesheet" href="./player.css" />
  </head>
  <body>
    <main id="eval-cinema">
      <header class="film-header"><strong>Build</strong><span id="title"></span></header>
      <p id="notice"></p>
      <nav id="steps" aria-label="Steps"></nav>
      <div class="film-stage">
        <header class="screen-head"><span id="object"></span><strong id="phase"></strong></header>
        <section id="scene" aria-live="off"></section>
      </div>
      <p id="caption" aria-live="polite"></p>
      <div class="controls">
        <button id="play"></button><button id="restart"></button><button id="prev"></button
        ><input id="seek" type="range" min="0" max="180" step="0.1" value="0" /><button id="next"></button
        ><output id="clock"></output>
      </div>
    </main>
    <script src="./locales.js"></script>
    <script src="./player.js"></script>
  </body>
</html>
