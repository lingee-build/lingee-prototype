<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能体配置 · 三页签并排预览</title>
<style>
:root{--ink:#24252b;--muted:#898b96;--line:#ececf1;--brand:#5658ed;--control:#fafafb;--r:12px;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:#eeeff3;color:var(--ink);font:14px/1.5 var(--sans)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid #9091f7;outline-offset:3px}button{border:0;background:none;color:inherit}svg{display:block}h1,h2,h3,p{margin:0}.board{max-width:1500px;margin:auto;padding:24px}.board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.board-head h1{font-size:20px;line-height:28px;font-weight:600;letter-spacing:.2px}.board-head p{margin-top:4px;color:#737682;font-size:12px}.review-tag{font-size:12px;color:#727582;background:#fff8;border:1px solid #dde0e7;border-radius:6px;padding:5px 10px}.comparison{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.view-label{margin:0 0 9px 2px;font-size:12px;font-weight:500;color:#717481}.view-label span{font-size:10px;letter-spacing:1px;color:#a0a3af;margin-right:8px}.editor{background:white;border:1px solid #e2e4eb;border-radius:14px;overflow:hidden;height:842px;display:flex;flex-direction:column;box-shadow:0 3px 12px #222a3a03}.identity{padding:22px 20px 18px;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover}.name-area{min-width:0;flex:1}.name-row{display:flex;align-items:center;gap:8px}.name-row strong{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;line-height:18px;padding:0 6px;border:1px solid var(--line);border-radius:5px;white-space:nowrap;color:#858791}.code{color:#999ba6;font-size:11px;margin-top:2px;letter-spacing:.1px}.close{padding:5px;color:#8d909b;font-size:20px;font-weight:300;line-height:1;cursor:default}.tabrow{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 16px;gap:2px;flex:none}.tab{font-size:13px;position:relative;white-space:nowrap;padding:10px 8px 13px;color:#858792}.tab.active{color:var(--ink);font-weight:600}.tab.active:after{content:"";height:2px;border-radius:2px;background:var(--brand);position:absolute;bottom:-1px;left:8px;right:8px}.tab:hover{color:var(--ink)}.body{padding:22px 20px;flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#e7e8ee transparent}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px}.field label{font-size:13px;color:#626570}.req{color:#e26167;margin-left:3px}.control{width:100%;height:38px;background:var(--control);border:1px solid #e7e8ef;border-radius:var(--r);padding:0 12px;color:#363842;outline:none;transition:.15s}input.control:focus,select.control:focus,textarea.control:focus{border-color:#9293f4;background:#fff;box-shadow:0 0 0 2px #5658ed09}textarea.control{height:88px;resize:vertical;line-height:22px;padding:10px 12px}select.control{appearance:none;padding-right:34px}.select{position:relative;width:100%}.select:after{content:"";position:absolute;width:6px;height:6px;right:15px;top:14px;transform:rotate(45deg);border-right:1.5px solid #9699a5;border-bottom:1.5px solid #9699a5;pointer-events:none}.domain{max-width:180px}.section{margin-top:21px;padding-top:19px;border-top:1px solid var(--line)}.section h3{font-size:13px;line-height:20px;font-weight:600;color:#4c4f59;margin-bottom:13px}.setting{display:flex;align-items:center;justify-content:space-between;gap:14px}.setting+.setting{margin-top:17px}.setting-title{font-size:13px;color:#454751}.hint{font-size:11px;color:#9295a0;line-height:18px;margin-top:2px}.toggle{width:32px;height:18px;background:var(--brand);padding:2px;border-radius:12px;display:flex;justify-content:flex-end;flex:none}.toggle:before{content:"";width:14px;height:14px;background:#fff;border-radius:50%;box-shadow:0 1px 2px #0001}.toggle[aria-checked=false]{background:#d0d2db;justify-content:flex-start}.level{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 0 5px 8px;white-space:nowrap;color:#60636e}.chevron{width:6px;height:6px;border-right:1px solid #9699a5;border-bottom:1px solid #9699a5;transform:rotate(45deg);margin:0 4px 3px 6px}.log-line{display:flex;align-items:center;gap:8px;font-size:12px}.version{font-weight:600;color:#4e505b}.date{color:#a0a2ad;font-size:11px}.dot{width:5px;height:5px;background:#7a7ced;border-radius:50%;flex:none}.log-text{margin-top:6px;font-size:12px;color:#797c88}.log-details{margin-top:8px;color:#6e7180;font-size:11px}.log-details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:4px}.log-details summary::-webkit-details-marker{display:none}.log-details p{margin-top:8px;color:#8c8f9b;line-height:19px}.log-details .chevron{width:5px;height:5px;transform:rotate(-45deg);margin-left:3px}.log-details[open] .chevron{transform:rotate(45deg)}.footer{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:8px;justify-content:flex-end;align-items:center;background:#fff;flex:none}.save-state{margin-right:auto;font-size:11px;color:#a1a3ad;display:flex;align-items:center;gap:5px}.save-state:before{content:"";width:4px;height:4px;background:#a9b5ae;border-radius:50%}.btn{height:32px;border-radius:8px;padding:0 13px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1px solid #e3e5ed;color:#5a5d69;white-space:nowrap}.btn:hover{border-color:#bebfe3;background:#fdfdff}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.primary:hover{background:#494bd9}.btn .chevron{width:5px;height:5px;margin:0 0 3px 3px;border-color:currentColor}.editor-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:13px;color:#626570}.small-muted{font-size:11px;color:#a0a2ad}.role-editor{border:1px solid #e7e8ef;border-radius:var(--r);background:var(--control);width:100%;height:474px;padding:15px;font-family:var(--sans);font-size:13px;line-height:23px;resize:vertical;outline:none;color:#50535f}.role-editor:focus{border-color:#9293f4;background:#fff}.role-hint{font-size:11px;line-height:19px;color:#979aa5;margin-top:10px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.toolbar .count{font-size:11px;color:#9295a0}.add{padding:0 11px;color:#686ad6;background:#fafaff;border-color:#e6e6f4}.skill-card{border:1px solid #e7e8ef;border-radius:var(--r);padding:14px 12px;display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}.skill-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;flex:none;font-size:17px;font-weight:500;background:#eff0ff;color:#7178d2}.skill-icon.pink{color:#c8767d;background:#fbf0f1}.skill-info{flex:1;min-width:0}.skill-title{display:flex;align-items:center;gap:8px;line-height:20px}.skill-title strong{font-size:13px;font-weight:500}.state{font-size:10px;color:#81a28b;white-space:nowrap}.state.pending{color:#9c946e}.skill-desc{font-size:11px;color:#8c8f9b;line-height:18px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.skill-meta{font-size:10px;color:#a5a7b0;margin-top:6px}.dots{font-size:14px;color:#a1a3ae;padding:0 2px}.empty-hint{font-size:11px;color:#a0a3ae;line-height:19px;margin-top:16px}.board-note{display:flex;justify-content:space-between;gap:20px;margin-top:15px;color:#7e8290;font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:9px 16px;background:#333644;color:#fff;border-radius:9px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.test-menu{position:absolute;bottom:52px;right:88px;padding:5px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 4px 20px #27304413;z-index:10}.test-menu button{display:block;text-align:left;padding:7px 12px;font-size:12px;border-radius:6px;width:100%}.test-menu button:hover{background:#f5f5fa}.footer{position:relative}@media(max-width:1000px){.comparison{grid-template-columns:repeat(3,420px)}.board{width:max-content;max-width:none}.board-head{max-width:1300px}.board-note{max-width:1300px}}
</style>
</head>
<body>
<main class="board">
  <header class="board-head"><div><h1>智能体配置 · 整套视觉预览</h1><p>三个页签使用同一套布局、字号、控件和间距，放在一起看效果。</p></div><span class="review-tag">独立预览 · 未覆盖当前页面</span></header>
  <div class="comparison" id="comparison"></div>
  <div class="board-note"><span>这版的变化：白色编辑画布，取消层层白卡；字段上下排列；操作固定在底部，标题区保持简洁。</span><span>可编辑输入 · 可切换页签 · 日志按需展开</span></div>
</main>
<div class="toast" role="status" id="toast"></div>
<template id="basic"><div class="field"><label>名称<span class="req">*</span></label><input class="control" aria-label="名称" value="供应链协同助手"></div><div class="field"><label>领域</label><div class="select domain"><select class="control" aria-label="领域"><option>供应链</option><option>财务</option><option>销售</option><option>通用</option></select></div></div><div class="field" style="margin-bottom:0"><label>功能描述<span class="req">*</span></label><textarea class="control" aria-label="功能描述">覆盖采购、库存、发货全链路的问答与单据处理，支持上下游单据追溯与业务协同。</textarea></div><section class="section"><h3>模型策略</h3><div class="setting"><div><div class="setting-title">允许切换模型</div><p class="hint">使用者可在对话中切换模型等级</p></div><button class="toggle" role="switch" aria-checked="true" aria-label="允许切换模型"></button></div><div class="setting"><div><div class="setting-title">默认模型等级</div><p class="hint">专业分析，精准决策</p></div><button class="level">专家<span class="chevron"></span></button></div></section><section class="section"><h3>更新日志</h3><div class="log-line"><span class="dot"></span><span class="version">v1.0.1</span><span class="date">2026-10-10</span></div><p class="log-text">新增销售履约协同能力。</p><details class="log-details"><summary>查看更新记录<span class="chevron"></span></summary><p>待发布：新增供应商风险监控智能体。<br>v1.0.0 · 2026-09-18 · 首次发布。</p></details></section></template>
<template id="role"><div class="editor-label"><span>角色提示词</span><span class="small-muted">Markdown</span></div><textarea class="role-editor" aria-label="角色提示词"># 角色
你是供应链协同助手，负责解答采购、库存、发货相关问题，并协助处理单据。

# 工作方式
1. 先确认单据类型与组织范围
2. 查询结果使用表格呈现
3. 发现上下游数量不一致时主动提示

# 边界
- 制度问题应引用知识库依据
- 涉及提交、审批等操作时，先向用户确认</textarea><p class="role-hint">描述智能体的角色定位、工作职责和行为边界。</p></template>
<template id="skills"><div class="toolbar"><button class="btn add" data-action="add">＋ 添加技能</button><span class="count">已添加 2 项</span></div><article class="skill-card"><div class="skill-icon">发</div><div class="skill-info"><div class="skill-title"><strong>发货通知单查询</strong><span class="state">已发布</span></div><p class="skill-desc">按单据编号、状态和通知日期查询，返回列表或物料行明细。</p><div class="skill-meta">云端技能</div></div><button class="dots" aria-label="发货通知单查询操作">⋯</button></article><article class="skill-card"><div class="skill-icon pink">即</div><div class="skill-info"><div class="skill-title"><strong>即时库存查询</strong><span class="state pending">审核中</span></div><p class="skill-desc">按物料、仓库、仓位查询即时库存与可用量。</p><div class="skill-meta">本地技能</div></div><button class="dots" aria-label="即时库存查询操作">⋯</button></article><p class="empty-hint">智能体会根据对话内容，按需调用已添加的技能。</p></template>
<script>
const names=['基础信息','角色设定','技能配置','子智能体','知识'];
const keys=['basic','role','skills','sub','knowledge'];
const board=document.getElementById('comparison');
const saveIcon='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h12l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M7 3v6h9V3M7 21v-8h10v8"/></svg>';
const testIcon='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3v6l-6 10a1 1 0 0 0 1 2h16a1 1 0 0 0 1-2L15 9V3M7 3h10M7 14h10"/></svg>';
function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function setTab(editor,key){editor.querySelectorAll('.tab').forEach(b=>{const selected=b.dataset.tab===key;b.classList.toggle('active',selected);b.setAttribute('aria-selected',selected)});const tpl=document.getElementById(key);editor.querySelector('.body').replaceChildren(...(tpl?tpl.content.cloneNode(true).childNodes:[]));if(!tpl)editor.querySelector('.body').innerHTML='<div class="editor-label">'+(key==='sub'?'子智能体':'知识')+'</div><p class="role-hint">此预览重点对照基础信息、角色设定与技能配置三个页签。</p>'}
['basic','role','skills'].forEach((key,index)=>{const column=document.createElement('section');column.innerHTML='<p class="view-label"><span>0'+(index+1)+'</span>'+names[index]+'</p><div class="editor"><header class="identity"><img class="avatar" alt="" src="../preset-agent-avatar-1.png"><div class="name-area"><div class="name-row"><strong>供应链协同助手</strong><span class="status">已发布</span></div><div class="code">scm-collab-assistant</div></div><span class="close" aria-hidden="true">×</span></header><nav class="tabrow" role="tablist">'+names.map((name,i)=>'<button class="tab" role="tab" data-tab="'+keys[i]+'">'+name+'</button>').join('')+'</nav><div class="body"></div><footer class="footer"><span class="save-state">已保存</span><button class="btn" data-action="save">'+saveIcon+'保存</button><button class="btn" data-action="test">'+testIcon+'测试<span class="chevron"></span></button><button class="btn primary" data-action="submit">提交</button></footer></div>';board.appendChild(column);setTab(column.querySelector('.editor'),key)});
board.addEventListener('click',event=>{const editor=event.target.closest('.editor');if(!editor)return;const tab=event.target.closest('[data-tab]');if(tab){setTab(editor,tab.dataset.tab);return}const toggle=event.target.closest('.toggle');if(toggle){toggle.setAttribute('aria-checked',toggle.getAttribute('aria-checked')!=='true');editor.querySelector('.save-state').textContent='未保存';return}const action=event.target.closest('[data-action]')?.dataset.action;if(action==='save'){editor.querySelector('.save-state').textContent='已保存';showToast('预览：保存按钮的位置与样式')}if(action==='submit')showToast('这是独立视觉预览，不会提交配置');if(action==='add')showToast('预览：保留现有添加技能流程');if(action==='test'){const existing=editor.querySelector('.test-menu');if(existing){existing.remove();return}const menu=document.createElement('div');menu.className='test-menu';menu.innerHTML='<button>本地测试</button><button>云端测试</button>';menu.addEventListener('click',()=>{menu.remove();showToast('这是独立视觉预览，不执行测试')});editor.querySelector('.footer').append(menu)}});
board.addEventListener('input',event=>{const editor=event.target.closest('.editor');if(editor)editor.querySelector('.save-state').textContent='未保存'});
</script>
</body>
</html>
